# XcodeGen spec for the iOS app. Regenerate the project with `xcodegen generate`
# from this folder; the .xcodeproj and Info.plist are build products, not sources.
name: RiftboundScannerApp
options:
  bundleIdPrefix: com.nsluke
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Swift 6.2 defaults (SE-0466 / SE-0461): the app module is main-actor isolated
    # unless a declaration says otherwise, and async functions run on the caller.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    DEVELOPMENT_TEAM: YMZ6ZTYGL8
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
packages:
  RiftboundScanner:
    path: ..
targets:
  RiftboundScannerApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The card index is Riot-derived and gitignored; build it with
      # `swift run -c release riftscan build-index` before generating the project.
      - path: ../cache/index.json
        buildPhase: resources
    dependencies:
      - package: RiftboundScanner
        product: RiftboundRecognizer
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Riftbound Scanner
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Riftbound Scanner photographs your cards to identify them. Photos stay on this phone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsluke.RiftboundScanner
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RiftboundScannerAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RiftboundScannerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsluke.RiftboundScannerTests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  RiftboundScannerApp:
    build:
      targets:
        RiftboundScannerApp: all
        RiftboundScannerAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RiftboundScannerAppTests
