# XcodeGen spec for the iOS app. Regenerate the project with `xcodegen generate`
# from this folder; the .xcodeproj and Info.plist are build products, not sources.
name: RiftboundScannerApp
options:
  bundleIdPrefix: com.nsluke
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Swift 6.2 defaults (SE-0466 / SE-0461): the app module is main-actor isolated
    # unless a declaration says otherwise, and async functions run on the caller.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    DEVELOPMENT_TEAM: YMZ6ZTYGL8
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
packages:
  RiftboundScanner:
    path: ..
targets:
  RiftboundScannerApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The card index is Riot-derived and gitignored; build it with
      # `swift run -c release riftscan build-index` before generating the project.
      - path: ../cache/index.json
        buildPhase: resources
      # Rules text, domains, TCGplayer ids and a price snapshot per printing,
      # extracted from Luke's Card Vault page.
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: RiftboundScanner
        product: RiftboundRecognizer
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Riftbound Scanner
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        NSCameraUsageDescription: Riftbound Scanner photographs your cards to identify them. Card photos are kept on this phone and uploaded only to your own home server.
        # The collection server is plain HTTP on the home network (ADR-002
        # Decision 5): riftbound.lan over the UniFi VPN, riftbound.local at
        # home, or a LAN address. Local networking covers .local and IPs;
        # the .lan name needs an explicit exception.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            riftbound.lan:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            riftbound.local:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        NSLocalNetworkUsageDescription: Riftbound Scanner looks for your own collection server on the local network to sync scans and holdings.
        NSBonjourServices: [_http._tcp]
        NSBluetoothAlwaysUsageDescription: Riftbound Scanner connects to your TCG Archivist card feeder over Bluetooth to advance cards while scanning.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsluke.RiftboundScanner
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RiftboundScannerAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RiftboundScannerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsluke.RiftboundScannerTests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  RiftboundScannerApp:
    build:
      targets:
        RiftboundScannerApp: all
        RiftboundScannerAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RiftboundScannerAppTests
