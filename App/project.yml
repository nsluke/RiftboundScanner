# XcodeGen spec for the iPhone and Mac apps. Regenerate the project with
# `xcodegen generate` from this folder; the .xcodeproj, both Info.plists and the
# Mac entitlements are build products, not sources.
name: RiftboundScannerApp
options:
  bundleIdPrefix: com.nsluke
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "27.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Swift 6.2 defaults (SE-0466 / SE-0461): the app module is main-actor isolated
    # unless a declaration says otherwise, and async functions run on the caller.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    DEVELOPMENT_TEAM: YMZ6ZTYGL8
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
packages:
  RiftboundScanner:
    path: ..
targets:
  RiftboundScannerApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The card index is Riot-derived and gitignored; build it with
      # `swift run -c release riftscan build-index` before generating the project.
      - path: ../cache/index.json
        buildPhase: resources
      # Rules text, domains, TCGplayer ids and a price snapshot per printing,
      # extracted from Luke's Card Vault page.
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: RiftboundScanner
        product: RiftboundRecognizer
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Riftbound Scanner
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        NSCameraUsageDescription: Riftbound Scanner photographs your cards to identify them. Card photos are kept on this phone and uploaded only to your own home server.
        # The collection server is plain HTTP on the home network (ADR-002
        # Decision 5): riftbound.lan over the UniFi VPN, riftbound.local at
        # home, or a LAN address. Local networking covers .local and IPs;
        # the .lan name needs an explicit exception.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            riftbound.lan:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            riftbound.local:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        NSLocalNetworkUsageDescription: Riftbound Scanner looks for your own collection server on the local network to sync scans and holdings, and lets your Mac use this iPhone as its scanning camera.
        NSBonjourServices: [_http._tcp, _riftcam._tcp]
        NSBluetoothAlwaysUsageDescription: Riftbound Scanner connects to your TCG Archivist card feeder over Bluetooth to advance cards while scanning.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsluke.RiftboundScanner
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RiftboundScannerAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RiftboundScannerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsluke.RiftboundScannerTests
        GENERATE_INFOPLIST_FILE: "YES"
  # The Mac app: the same sources, with the iPhone as its camera through
  # Continuity Camera. Platform differences live behind `#if os(macOS)` seams
  # in the shared files (see README, "The Mac app").
  RiftboundScannerMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: ../cache/index.json
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: RiftboundScanner
        product: RiftboundRecognizer
    info:
      path: MacInfo.plist
      properties:
        CFBundleDisplayName: Riftbound Scanner
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.utilities
        NSCameraUsageDescription: Riftbound Scanner photographs your cards through your iPhone (Continuity Camera) or another camera to identify them. Card photos stay on this Mac and are uploaded only to your own home server.
        # Continuity Camera devices are only discoverable with this key.
        NSCameraUseContinuityCameraDeviceType: true
        NSBluetoothAlwaysUsageDescription: Riftbound Scanner connects to your TCG Archivist card feeder over Bluetooth to advance cards while scanning.
        NSLocalNetworkUsageDescription: Riftbound Scanner looks for your own collection server on the local network to sync scans and holdings, and finds your iPhone when it is the Mac's scanning camera.
        NSBonjourServices: [_http._tcp, _riftcam._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            riftbound.lan:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            riftbound.local:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: RiftboundScannerMac.entitlements
      properties:
        # Sandboxed: scans live in the app's container
        # (~/Library/Containers/com.nsluke.RiftboundScannerMac/Data/Documents/Scans).
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.device.bluetooth: true
        # The collection server on the home network.
        com.apple.security.network.client: true
        # Saving an exported batch where the user chooses in the share sheet.
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsluke.RiftboundScannerMac
        PRODUCT_NAME: Riftbound Scanner
        # The iPhone app's module name, so the tests' `@testable import
        # RiftboundScannerApp` builds against either app.
        PRODUCT_MODULE_NAME: RiftboundScannerApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
  # The same tests, run natively on the Mac against the Mac app.
  RiftboundScannerMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    dependencies:
      - target: RiftboundScannerMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsluke.RiftboundScannerMacTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Riftbound Scanner.app/Contents/MacOS/Riftbound Scanner"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  RiftboundScannerApp:
    build:
      targets:
        RiftboundScannerApp: all
        RiftboundScannerAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RiftboundScannerAppTests
  RiftboundScannerMac:
    build:
      targets:
        RiftboundScannerMac: all
        RiftboundScannerMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RiftboundScannerMacTests
